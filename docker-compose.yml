x-env: &default-env
  ENV: "dev"
  TZ: "Europe/Oslo"

services:
  # Local LLM runtime
  local-llm:
    image: ollama/ollama:latest
    ports:
      - "8001:11434"          # host:container
    volumes:
      - ollama:/root/.ollama  # cache models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 15

  # API (depends on db/redis/minio + optional bootstrap)
  api:
    build: ./service/api
    env_file: ./.env
    environment:
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-astro-raw}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/healthz" ]
      interval: 10s
      timeout: 2s
      retries: 10

  # Traits processor (LLM + storages)
  traits:
    build:
      context: ./service/traits
      dockerfile: Dockerfile
    env_file: ./.env
    environment:
      <<: *default-env
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_RAW: astro-raw
      MINIO_BUCKET_REPORTS: astro-reports
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-bge-large}
      TRAIT_LLM_PROVIDER: ollama
      TRAIT_LLM_BASE_URL: http://local-llm:11434
      TRAIT_LLM_MODEL: qwen2.5:7b-instruct-q4_K_M
    depends_on:
      db:        { condition: service_healthy }
      redis:     { condition: service_healthy }
      minio:     { condition: service_healthy }
      local-llm: { condition: service_healthy }
      bootstrap: { condition: service_completed_successfully }

  worker-ingest:
    build: ./service/worker_ingest
    env_file: ./.env
    environment:
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    command: [ "rq", "worker", "-u", "${REDIS_URL}", "default" ]

  # Postgres with pgvector extension baked in
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-astro_reason}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: "Europe/Oslo"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 2s
      timeout: 3s
      retries: 30

  # Redis with readiness check
  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # MinIO with readiness check
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 40

  # Grafana (waits for DB)
  grafana:
    image: grafana/grafana:11.0.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional: lightweight embedding service if you want local embeddings
  embeddings:
    build:
      context: ./service/embeddings
      dockerfile: Dockerfile
    env_file: ./.env
    environment:
      <<: *default-env
    ports:
      - "8090:8090"
    deploy:
      replicas: 1
    depends_on:
      redis: { condition: service_healthy }

  # One-shot bootstrap job (buckets, seeds, migrations)
  bootstrap:
    image: minio/mc
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
      # (optional) pass DB env if you do DB migrations here
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-astro_reason}
    depends_on:
      db:    { condition: service_healthy }
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh","-lc"]
    command: |
      set -e
      echo "Configuring MinIO buckets…"
      mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
      mc mb -p local/astro-raw     || true
      mc mb -p local/astro-reports || true
      echo "Bootstrap complete."

volumes:
  db_data:
  minio_data:
  ollama:
